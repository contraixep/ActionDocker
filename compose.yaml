services:
  windows:
    image: dockurr/windows
    environment:
      REGION: "South Central US"  # Thay đổi region tại đây
      DISK_SIZE: "12G"
      RAM_SIZE: "24G"
      CPU_CORES: "8"
      DISK_TYPE: "ide"
      ARGUMENTS: "-drive file=/driver.iso,media=cdrom"
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    volumes:
      - /mnt:/storage
      - /isos/a.iso:/custom.iso
      - /isos/driver.iso:/driver.iso
    stop_grace_period: 2m
